[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lark-card-kit"
version = "0.1.0"
description = "A Python library for building Feishu/Lark card 2.0 messages"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "LarkCardKit Team" }
]
keywords = [
    "lark",
    "feishu",
    "card",
    "message",
    "bot",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/anthropics/lark-card-kit"
Documentation = "https://github.com/anthropics/lark-card-kit#readme"
Repository = "https://github.com/anthropics/lark-card-kit.git"

[tool.hatch.build.targets.wheel]
packages = ["lark_card_kit"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]